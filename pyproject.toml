[project]
name = "prosodic-mer"
version = "0.1.0"
description = ""
requires-python = ">=3.11,<3.12"
dependencies = [
    "spleeter==2.4.2",
    "numpy>=1.23,<=1.24.3",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "torch",
    "transformers",
    "torchvggish",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmr"]

[tool.uv]
override-dependencies = ["tensorflow==2.15.1"]
