[project]
name = "prosodic-mer"
version = "0.1.0"
description = "Word-level prosody integration for music emotion recognition (MMD-MII reproduction)"
requires-python = ">=3.11,<3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmr"]
